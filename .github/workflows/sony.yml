name: Update Sony Playlist

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['script/sony.py', 'script/sony3.py']

# Do NOT cancel in progress — a mid-push cancel corrupts state.
concurrency:
  group: update-sony
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scripts
        run: |
          python script/sony.py
          python script/sony3.py

      - name: Debug — show what the scripts produced
        run: |
          echo "===== repo root ====="
          ls -la
          echo "===== m3u files ====="
          find . -name '*.m3u*' -not -path './.git/*' -exec ls -la {} \;
          echo "===== sony5.m3u head ====="
          head -20 sony5.m3u || echo "sony5.m3u NOT FOUND"
          echo "===== sony6.m3u head ====="
          head -20 sony6.m3u || echo "sony6.m3u NOT FOUND"
          echo "===== git status ====="
          git status --porcelain

      - name: Commit
        id: commit
        run: |
          if [ ! -f sony5.m3u ]; then
            echo "::error::sony5.m3u was not created by sony.py"
            exit 1
          fi
          if [ ! -f sony6.m3u ]; then
            echo "::error::sony6.m3u was not created by sony3.py"
            exit 1
          fi

          git add sony5.m3u sony6.m3u


            echo "Push rejected, backing off..."
            sleep $((i * 3))
            echo "::endgroup::"
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
